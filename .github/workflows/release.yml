# Pushing a tag such as v0.2.0 builds the apps of macOS, Windows and
# Linux, signs their updates, and uploads them to a draft
# release of the tag, which is published by hand: installed apps update
# to it then.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # mygo build uploads to the release of mygo.json's version, whichever
      # tag started the workflow.
      - name: Check the version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      # mygo build puts the version's section of CHANGELOG.md in the update
      # manifests, which the update window shows; the release page gets the
      # same notes, in place of GitHub's from the pull requests.
      - name: Take the notes from the changelog
        run: |
          awk -v heading="## ${GITHUB_REF_NAME#v}" '
            /^## / { inside = ($0 == heading); next }
            inside
          ' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      # macOS uses MyGo's default ad-hoc signature, without Developer ID
      # credentials or notarization. Update archives are signed separately.
      - name: Build signed packages
        env:
          CGO_ENABLED: "0"
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          test -n "$MYGO_UPDATER_PRIVATE_KEY" || { echo "Missing update signing key" >&2; exit 1; }
          go tool mygo build -platform "${{ matrix.platform }}"
          for target in $(echo "${{ matrix.platform }}" | tr "," " " | tr "/" "-"); do
            test -f "build/$target/update-$target.json" || { echo "Missing signed update manifest for $target" >&2; exit 1; }
          done
      - name: Save build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.name }}
          path: |
            build/SHA256SUMS
            build/*/*.dmg
            build/*/*-setup-*.exe
            build/*/*.deb
            build/*/*.tar.gz
            build/*/*.delta
            build/*/update-*.json
            build/*/install.sh
            build/*/install.ps1
          if-no-files-found: error
          retention-days: 1

  upload:
    needs: [draft-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Merge and verify release assets
        run: |
          mkdir -p dist
          find artifacts -type f ! -name 'SHA256SUMS' -exec cp -f {} dist/ \;
          cat artifacts/release-*/SHA256SUMS | tr -d '\r' | sort -u -k2,2 | while read -r sum name; do
            if [ -f "dist/$name" ]; then
              printf '%s  %s\n' "$sum" "$name"
            fi
          done > dist/SHA256SUMS
          test -s dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Upload installers and update packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=()
          for f in dist/*; do
            base=$(basename "$f")
            case "$base" in
              update-*.json) ;;
              *) files+=("$f") ;;
            esac
          done
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
      - name: Upload update manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          manifests=(dist/update-*.json)
          test ${#manifests[@]} -eq 6
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${manifests[@]}"
